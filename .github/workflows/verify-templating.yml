name: Verify Templating

on:
  pull_request:
    paths:
      - "**/Dockerfile"
  push:
    paths:
      - "**/Dockerfile"

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  apply-templates:
    name: Check For Uncomitted Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: docker-library/bashbrew@v0.1.12
      - name: Apply Templates
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              # For PRs, compare against the merge base
              git fetch origin ${{ github.base_ref }}
              changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            else
              changed_files=$(git diff --name-only HEAD~1 HEAD)
            fi
            if echo $changed_files | grep -qE "^(versions\.json|[0-9]+\.[0-9]+/|unstable/)"; then
              changed_versions=$(echo $changed_files | grep -oE "[0-9]+\.[0-9]+|unstable" | sort -u | tr '\n' '|' | sed 's/|$//')
          ./apply-templates.sh $changed_versions
      - name: Check Git Status
        run: |
          echo "==== GIT STATUS BEGIN ===="
          status="$(git status --short)"
          printf '%s\n' "$status" | cat -A
          echo "==== GIT STATUS END ===="

          git status

          if [ -z "$status" ]; then
            echo "No changes detected."
          else
            echo "Changes detected!"
            git diff
            exit 1
          fi
